<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diário do Bebê</title>
<meta name="description" content="Sono, mamadas, fraldas, estoque, crescimento, agenda, exames e vacinas do bebê, compartilhado pela família.">
<meta name="theme-color" content="#2B7A70">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Diário do Bebê">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: header com idade do bebê, barra de ações rápidas (fixa embaixo no celular), abas fixas no topo, cartões por assunto */
:root{
  --bg:#EEF3F5; --surface:#FFFFFF; --surface2:#F5F8F9; --line:#D8E1E5;
  --ink:#1C2A36; --muted:#5D6C78; --accent:#2B7A70; --accent-ink:#FFFFFF; --accent-soft:#DCEFEC;
  --sleep:#5566C4; --feed:#D9822B; --diaper:#2E9583; --health:#CC4E73; --growth:#6F9334; --other:#7B8794;
  --ok:#2E8B57; --warn:#C98A12; --bad:#C8423B; --live-ink:#FFFFFF;
  --display:"Fredoka","Nunito Sans",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F161C; --surface:#172129; --surface2:#1D2933; --line:#2A3946;
  --ink:#E4ECF1; --muted:#97A7B3; --accent:#5CC2B3; --accent-ink:#0B1F1C; --accent-soft:#1D3B38;
  --sleep:#8D9AF0; --feed:#F0A55A; --diaper:#56C2AE; --health:#F07A9C; --growth:#A3C76A; --other:#9AA6B2;
  --ok:#5BC48A; --warn:#E8B547; --bad:#F07068; --live-ink:#0F161C; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#172129; --surface2:#1D2933; --line:#2A3946;
  --ink:#E4ECF1; --muted:#97A7B3; --accent:#5CC2B3; --accent-ink:#0B1F1C; --accent-soft:#1D3B38;
  --sleep:#8D9AF0; --feed:#F0A55A; --diaper:#56C2AE; --health:#F07A9C; --growth:#A3C76A; --other:#9AA6B2;
  --ok:#5BC48A; --warn:#E8B547; --bad:#F07068; --live-ink:#0F161C; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100vh}
img{max-width:100%}
.auth{max-width:440px;margin:24px auto;display:flex;flex-direction:column;gap:14px}
.auth form{display:flex;flex-direction:column;gap:14px}
.code{font-family:var(--display);font-size:30px;letter-spacing:.12em;font-weight:600;color:var(--accent);user-select:all}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{padding-block:6px 10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-size:24px;font-weight:600;flex:none}
.top .who-baby{flex:1;min-width:0}
.top h1{font-size:26px;line-height:1.1}
.age{color:var(--muted);font-size:14px}
.age b{color:var(--ink);font-weight:700}
.whoami{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

/* segmented */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.seg.big span{padding:9px 16px}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding-block:6px 12px}
.qa{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-weight:700;font-size:13px;min-height:68px;justify-content:center;text-align:center;line-height:1.15}
.qa svg{width:24px;height:24px}
.qa:hover{border-color:var(--accent)}
.qa .sub{font-weight:600;font-size:11px;color:var(--muted)}
.qa.live{background:var(--c);border-color:var(--c);color:var(--live-ink)}
.qa.live .sub{color:var(--live-ink);opacity:.85}
@media (max-width:719px){
  .quick{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);margin:0;
    padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));gap:6px}
  .qa{min-height:60px;padding:8px 2px;font-size:12px}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .top h1{font-size:22px}
}

/* tabs */
.tabsbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;border-radius:10px;font-size:14px}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:5px;vertical-align:middle}

main{padding-block:18px 40px;display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
@media (max-width:719px){.g2,.g3{grid-template-columns:minmax(0,1fr)} .g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font-size:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:21px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* status tiles */
.tile{position:relative;padding:14px 14px 14px 16px;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.tile .big{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:13px;color:var(--muted);margin-top:2px}
.tile .act{margin-top:10px}
@media (max-width:719px){.tile .big{font-size:23px}}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);white-space:nowrap}
.pill.ok{--c:var(--ok)}.pill.warn{--c:var(--warn)}.pill.bad{--c:var(--bad)}.pill.neutral{--c:var(--muted)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0;font-size:13px}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;font-weight:700;display:inline-grid;place-items:center}
.iconbtn:hover{border-color:var(--accent)}

/* summary strip */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.stat{background:var(--surface);padding:12px 14px}
.stat .v{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .k{font-size:12.5px;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:52px 12px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 4px;border-bottom:1px dashed var(--line);cursor:pointer;border-radius:8px}
.tl li:last-child{border-bottom:0}
.tl li:hover{background:var(--surface2)}
.tl .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.tl .d{width:12px;height:12px;border-radius:50%;background:var(--c);margin-top:4px}
.tl .ttl{font-weight:700}
.tl .ds{font-size:13px;color:var(--muted)}
.tl .by{font-size:11.5px;color:var(--muted);font-weight:700;padding-top:2px}
.empty{padding:22px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:var(--surface2)}
.empty b{color:var(--ink)}

/* lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:160px}
.row .ttl{font-weight:700}
.qty{display:flex;align-items:center;gap:6px}
.qty .n{min-width:44px;text-align:center;font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--c);border-radius:99px}

/* charts */
.ch{width:100%;height:auto;display:block}
.ch text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.ch .grid line{stroke:var(--line)}
.ch .vlab{fill:var(--ink);font-weight:700}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num,th.num{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}

/* vaccines */
.vgroup{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.vgroup:last-child{border-bottom:0}
.vgroup .when{font-weight:700}
.vlist{display:flex;flex-wrap:wrap;gap:8px}
.vchip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;cursor:pointer;text-align:left;font-size:13px;line-height:1.25}
.vchip b{display:block;font-size:13.5px}
.vchip.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
.vchip.late{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.vchip.soon{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
@media (max-width:560px){.vgroup{grid-template-columns:minmax(0,1fr);gap:6px}}

/* phases */
.phase-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:719px){.phase-hero{grid-template-columns:minmax(0,1fr)}}
.facts{display:grid;gap:10px}
.fact{background:var(--surface2);border-radius:10px;padding:10px 12px}
.fact .label{margin-bottom:2px}
ul.marks{margin:6px 0 0;padding-left:18px}
ul.marks li{margin:3px 0}
.ptrack{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.pstep{flex:none;width:150px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);font-size:13px}
.pstep.now{border-color:var(--accent);background:var(--accent-soft)}
.pstep.past{opacity:.6}

/* banner / toast */
.banner{border-radius:12px;padding:10px 14px;font-size:14px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .25)}
.toast.err{background:var(--bad);color:#fff}
@media (min-width:720px){.toast{bottom:28px}}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modal .ov{position:absolute;inset:0;background:rgb(10 20 28 / .45)}
.sheet{position:relative;background:var(--surface);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -8px 40px rgb(0 0 0 / .25)}
@media (min-width:720px){#modal{align-items:center}.sheet{border-radius:18px}}
.sheet header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet h3{font-size:20px}
.x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
.sheet form{display:flex;flex-direction:column;gap:14px}
.sheet footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:6px}
.sp{flex:1}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-size:13px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.fld textarea{min-height:80px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.choice{border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:16px 10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px}
.choice:hover{border-color:var(--c,var(--accent))}
.choice i{width:14px;height:14px;border-radius:50%;background:var(--c,var(--accent))}
.hint{font-size:13px;color:var(--muted)}

.setup{max-width:560px;margin:30px auto}
.setup h2{font-size:26px;margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:15px;color:var(--accent);padding-top:14px}
.brand svg{width:28px;height:28px;flex:none}
.files{display:flex;flex-wrap:wrap;gap:8px}
.file{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:13px;background:var(--surface2);max-width:100%}
.file a{color:var(--accent);font-weight:700;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.file button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:17px;line-height:1;padding:0 2px}
.gc{color:var(--ok);font-weight:700;font-size:12.5px;white-space:nowrap}
.snip{font-size:13px;margin-top:4px;color:var(--ink);background:var(--surface2);border-radius:8px;padding:6px 9px;white-space:pre-wrap;overflow-wrap:anywhere}
ol.steps{margin:6px 0 0;padding-left:20px}ol.steps li{margin:4px 0}
</style>
</head>
<body>

<div id="app">
  <div class="wrap"><div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#2B7A70"/></svg>Diário do Bebê</div><div class="top"><div class="who-baby"><div class="age">Carregando os dados da família…</div></div></div></div>
</div>
<div id="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="vendor/supabase.js"></script>
<script>
/* ============ logo ============ */
const LOGO='<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#2B7A70"/><circle cx="50" cy="15" r="4.5" fill="#F2A65A"/><g fill="#FFFFFF"><ellipse cx="33" cy="40" rx="9.5" ry="13.5" transform="rotate(-14 33 40)"/><circle cx="25.5" cy="20" r="4.4"/><circle cx="33" cy="17.6" r="3.4"/><circle cx="39" cy="19.4" r="2.8"/><circle cx="43.4" cy="23.4" r="2.3"/><circle cx="46" cy="28.4" r="1.9"/></g></svg>';
const BRAND=`<div class="brand">${LOGO}Diário do Bebê</div>`;

/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const MIN=6e4,HR=36e5,DAY=864e5;
const MO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MOF=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const WD=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const dayStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const addDays=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()};
const ymOf=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const prevYm=ym=>{let[y,m]=ym.split('-').map(Number);m--;if(!m){m=12;y--}return y+'-'+pad(m)};
const fmtT=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fmtD=t=>{const d=new Date(t);return d.getDate()+' '+MO[d.getMonth()]};
const fmtDY=t=>{const d=new Date(t);return d.getDate()+' '+MO[d.getMonth()]+' '+d.getFullYear()};
const dateOnly=s=>s?new Date(s+'T12:00').getTime():null;
const isoDate=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
function fmtDur(ms){ms=Math.max(0,ms);const m=Math.round(ms/MIN);if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;if(h>=48)return Math.floor(h/24)+' dias';return h+'h'+(r?' '+pad(r):'')}

function age(now=Date.now()){
 if(!S.cfg?.birth)return null;
 const b=new Date(S.cfg.birth+'T00:00'),n=new Date(now);
 let m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;
 const a=new Date(b);a.setMonth(b.getMonth()+m);
 const d=Math.max(0,Math.floor((dayStart(now)-a.getTime())/DAY));const days=Math.floor((dayStart(now)-b.getTime())/DAY);
 return {m:Math.max(0,m),d,days,months:days/30.4375};
}
function ageText(a){if(!a)return'';if(a.days<0)return'ainda não nasceu';if(a.days<31)return a.days===1?'1 dia':a.days+' dias';
 const y=Math.floor(a.m/12),mm=a.m%12;let s='';if(y)s+=y+(y>1?' anos':' ano');if(mm)s+=(s?' e ':'')+mm+(mm>1?' meses':' mês');if(y<2&&a.d)s+=' e '+a.d+(a.d>1?' dias':' dia');return s}

 const feeds=inDay.filter(e=>e.type==='feed'),di=inDay.filter(e=>e.type==='diaper');
 return {sleep:sleepIn(evs,t0,t1),feeds:feeds.length,ml:feeds.reduce((s,e)=>s+(+e.ml||0),0),
  diapers:di.length,xixi:di.filter(e=>e.kind==='xixi'||e.kind==='ambos').length,coco:di.filter(e=>e.kind==='coco'||e.kind==='ambos').length,list:inDay};
}
function diaperStats(){

 const evs=allEv().filter(e=>e.type==='diaper'&&e.start<=now);
 const today=evs.filter(e=>e.start>=dayStart(now)).length;
 const last7=evs.filter(e=>e.start>=now-7*DAY);
 let avg=0,est=false;
 if(last7.length>=3){const first=Math.min(...evs.map(e=>e.start));avg=last7.length/Math.max(1,Math.min(7,(now-first)/DAY))}
 else{const a=age();const m=a?a.months:0;avg=m<1?10:m<6?8:m<12?6:5;est=true}

}

  case'diaper':{const it=S.inv.find(i=>i.id===e.itemId);return{t:'Fralda · '+(DK[e.kind]||''),d:it?it.name+(it.size?' '+it.size:''):''}}

  <div class="card"><div class="card-h"><h2>Mamadas por dia</h2><span class="small muted">média ${num(st.reduce((s,x)=>s+x.feeds,0)/7)}</span></div>${bars(st.map(x=>x.feeds),lbl,'var(--feed)')}</div>
  <div class="card"><div class="card-h"><h2>Fraldas por dia</h2><span class="small muted">média ${num(st.reduce((s,x)=>s+x.diapers,0)/7)}</span></div>${bars(st.map(x=>x.diapers),lbl,'var(--diaper)')}</div>
 </div>`;

function niceMax(v){if(v<=0)return 1;const p=10**Math.floor(Math.log10(v)),f=v/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function bars(vals,labels,color,o={}){
 const fmt=o.fmt||(v=>Math.round(v)),W=320,H=170,pl=26,pr=6,pt=18,pb=22,cw=W-pl-pr,chh=H-pt-pb;
 const mx=niceMax(Math.max(...vals,o.ref?o.ref[1]:0,1)),y=v=>pt+chh-(v/mx)*chh,bw=cw/vals.length;
 let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img"><g class="grid">`;
 for(let i=0;i<=4;i++){const v=mx*i/4;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-4}" y="${y(v)+3}" text-anchor="end">${num(v)}</text>`}
 s+='</g>';
 if(o.ref)s+=`<rect x="${pl}" width="${cw}" y="${y(o.ref[1])}" height="${y(o.ref[0])-y(o.ref[1])}" fill="${color}" opacity=".12"/>`;
 vals.forEach((v,i)=>{const x=pl+i*bw+bw*.2,w=bw*.6;if(v>0)s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${pt+chh-y(v)}" rx="3" fill="${color}"/><text class="vlab" x="${x+w/2}" y="${y(v)-4}" text-anchor="middle">${fmt(v)}</text>`;
  s+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`});
 return s+'</svg>';
}

VIEWS.crescimento=()=>{
 const g=[...S.growth].sort((a,b)=>a.date.localeCompare(b.date)),last=g[g.length-1],prev=g[g.length-2];
 const lastW=[...g].reverse().find(x=>x.w),lastL=[...g].reverse().find(x=>x.l),lastHc=[...g].reverse().find(x=>x.hc);
 const diff=(k)=>{const arr=g.filter(x=>x[k]);if(arr.length<2)return'';const a2=arr[arr.length-1],a1=arr[arr.length-2];const d=a2[k]-a1[k];return`${d>=0?'+':''}${num(d,k==='w'?2:1)} desde ${fmtD(dateOnly(a1.date))}`};
 const boy=S.cfg.sex!=='f';
 return`
 <div class="sec-h"><h2>Crescimento</h2><button class="btn primary" data-act="growthAdd">Nova medida</button></div>
 <div class="grid g3">
  <div class="card tile" style="--c:var(--growth)"><div class="label">Peso</div><div class="big">${lastW?num(lastW.w,2)+' kg':'—'}</div><div class="sub">${lastW?diff('w')||'em '+fmtDY(dateOnly(lastW.date)):'sem medidas'}</div></div>
  <div class="card tile" style="--c:var(--growth)"><div class="label">Comprimento</div><div class="big">${lastL?num(lastL.l)+' cm':'—'}</div><div class="sub">${lastL?diff('l')||'em '+fmtDY(dateOnly(lastL.date)):'sem medidas'}</div></div>
  <div class="card tile" style="--c:var(--growth)"><div class="label">Perímetro cefálico</div><div class="big">${lastHc?num(lastHc.hc)+' cm':'—'}</div><div class="sub">${lastHc?diff('hc')||'em '+fmtDY(dateOnly(lastHc.date)):'sem medidas'}</div></div>
 </div>
 <div class="grid g2">
  <div class="card"><div class="card-h"><h2>Peso por idade</h2><span class="small muted">kg × meses</span></div>${growthChart(g,'w',boy?WHO_W:null)}</div>
  <div class="card"><div class="card-h"><h2>Comprimento por idade</h2><span class="small muted">cm × meses</span></div>${growthChart(g,'l',boy?WHO_L:null)}</div>
 </div>
 <div class="hint">${boy?'Faixa sombreada: entre os percentis 3 e 97 das curvas da OMS para meninos; linha tracejada: mediana. Valores aproximados; quem interpreta é o pediatra.':'As curvas de referência aparecem só para meninos nesta versão.'}</div>
 <div class="card"><div class="card-h"><h2>Histórico de medidas</h2></div>
  ${g.length?`<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Idade</th><th class="num">Peso</th><th class="num">Comprimento</th><th class="num">Cabeça</th><th>Obs.</th></tr></thead><tbody>${[...g].reverse().map(x=>{const a=age(dateOnly(x.date));return`<tr class="click" data-act="growthEdit" data-id="${x.id}"><td>${fmtDY(dateOnly(x.date))}</td><td>${esc(ageText(a))}</td><td class="num">${x.w?num(x.w,2)+' kg':'—'}</td><td class="num">${x.l?num(x.l)+' cm':'—'}</td><td class="num">${x.hc?num(x.hc)+' cm':'—'}</td><td>${esc(x.note||'')}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">Anote peso e comprimento de cada consulta para acompanhar a curva. Comece pelas medidas do nascimento.</div>`}
 </div>`;
};
function interp(arr,m){if(m<=WHO_M[0])return arr[0];for(let i=1;i<WHO_M.length;i++)if(m<=WHO_M[i]){const t=(m-WHO_M[i-1])/(WHO_M[i]-WHO_M[i-1]);return arr[i-1]+t*(arr[i]-arr[i-1])}return arr[arr.length-1]}
function growthChart(g,k,ref){
 const pts=g.filter(x=>x[k]).map(x=>{const a=age(dateOnly(x.date));return{m:a?a.months:0,v:+x[k]}}).filter(p=>p.m>=0);
 const a=age(),maxM=Math.min(24,Math.max(6,Math.ceil(Math.max(a?a.months:0,...pts.map(p=>p.m))+1)));
 if(!pts.length&&!ref)return`<div class="empty">Sem medidas ainda.</div>`;
 let lo=Infinity,hi=-Infinity;pts.forEach(p=>{lo=Math.min(lo,p.v);hi=Math.max(hi,p.v)});
 if(ref){lo=Math.min(lo,ref.p3[0]);hi=Math.max(hi,interp(ref.p97,maxM))}
 const span=hi-lo||1;lo=Math.floor(lo-span*.05);hi=Math.ceil(hi+span*.05);
 const W=340,H=210,pl=30,pr=10,pt=10,pb=24,X=m=>pl+m/maxM*(W-pl-pr),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
 let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img"><g class="grid">`;
 const step=niceMax((hi-lo)/5);for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-4}" y="${Y(v)+3}" text-anchor="end">${num(v)}</text>`;
 const xs=maxM<=12?1:3;for(let m=0;m<=maxM;m+=xs)s+=`<text x="${X(m)}" y="${H-8}" text-anchor="middle">${m}</text>`;
 s+='</g>';
 if(ref){const ms=[];for(let m=0;m<=maxM;m+=.5)ms.push(m);
  s+=`<polygon points="${ms.map(m=>X(m)+','+Y(interp(ref.p97,m))).join(' ')} ${ms.slice().reverse().map(m=>X(m)+','+Y(interp(ref.p3,m))).join(' ')}" fill="var(--growth)" opacity=".13"/>`;
  s+=`<polyline points="${ms.map(m=>X(m)+','+Y(interp(ref.p50,m))).join(' ')}" fill="none" stroke="var(--growth)" stroke-dasharray="4 4" stroke-width="1.5" opacity=".8"/>`}
 if(pts.length>1)s+=`<polyline points="${pts.map(p=>X(p.m)+','+Y(p.v)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
 pts.forEach((p,i)=>s+=`<circle cx="${X(p.m)}" cy="${Y(p.v)}" r="${i===pts.length-1?5:3.5}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`);
 return s+'</svg>';
}

let M=null;
function openModal({title,body,onSave,onDelete,saveLabel='Salvar',mount,noFooter}){
 $('#modal').innerHTML=`<div class="ov" data-act="mclose"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><header><h3 id="mt">${title}</h3><button class="x" type="button" data-act="mclose" aria-label="Fechar">×</button></header>
 <form id="mf" novalidate>${body}${noFooter?'':`<footer>${onDelete?'<button type="button" class="btn danger" data-act="mdel">Apagar</button>':''}<span class="sp"></span><button type="button" class="btn ghost" data-act="mclose">Cancelar</button>${onSave?`<button class="btn primary" type="submit">${saveLabel}</button>`:''}</footer>`}</form></div>`;
 M={onSave,onDelete};$('#modal').hidden=false;const f=$('#mf');mount&&mount(f);
 const first=f.querySelector('input:not([type=radio]):not([type=hidden]),select,textarea');if(first&&matchMedia('(min-width:720px)').matches)first.focus();
}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML='';M=null}

/* ---------- formulários de eventos ---------- */
function suggestSide(){const l=allEv().find(e=>e.type==='feed'&&e.kind==='peito');return l?(l.side==='E'?'D':l.side==='D'?'E':'E'):'E'}
function diaperSelect(sel){const fr=S.inv.filter(i=>i.cat==='fralda');if(!fr.length)return'';return fld('Descontar do pacote',`<select name="itemId" id="f-item"><option value="">Não descontar</option>${fr.map(i=>`<option value="${i.id}"${sel===i.id?' selected':''}>${esc(i.name)}${i.size?' '+esc(i.size):''} (${i.qty||0})</option>`).join('')}</select>`)}
function eventForm(ev,isNew){
 const t=ev.type;let h='';const endV=ev.end!=null?toLocalInput(ev.end):'';
 if(t==='feed')h+=seg('kind',[['peito','Peito'],['mamadeira','Mamadeira'],['solido','Comidinha']],ev.kind||'peito');
 if(t==='diaper')h+=seg('kind',[['xixi','Xixi'],['coco','Cocô'],['ambos','Xixi e cocô'],['seca','Seca']],ev.kind||'xixi');
 h+=fld(t==='sleep'||t==='feed'?'Início':'Horário',`<input type="datetime-local" name="start" id="f-start" value="${toLocalInput(ev.start||Date.now())}" required>`);
 if(t==='sleep')h+=fld('Fim (deixe vazio se ainda está dormindo)',`<input type="datetime-local" name="end" id="f-end" value="${endV}">`);
 if(t==='feed')h+=`<div data-show="peito" style="display:flex;flex-direction:column;gap:14px"><div class="fld"><span>Lado</span>${seg('side',[['E','Esquerdo'],['D','Direito'],['ambos','Os dois']],ev.side||suggestSide())}</div>
   ${fld('Fim (deixe vazio se está mamando agora)',`<input type="datetime-local" name="end" id="f-end" value="${endV}">`)}
   ${isNew?'<button type="button" class="btn" data-act="feedTimer" style="justify-content:center">Começar a mamar agora (cronômetro)</button>':''}</div>
  <div data-show="mamadeira" style="display:flex;flex-direction:column;gap:14px">${fld('Quantidade (ml)',`<input type="number" min="0" step="5" name="ml" id="f-ml" value="${ev.ml||''}" inputmode="numeric">`)}${seg('milk',[['formula','Fórmula'],['materno','Leite materno']],ev.milk||'formula')}</div>
  <div data-show="solido" style="display:flex;flex-direction:column;gap:14px">${fld('O que comeu',`<input name="food" id="f-food" value="${esc(ev.food||'')}" placeholder="Ex.: papinha de abóbora">`)}${seg('accept',[['bem','Comeu bem'],['pouco','Comeu pouco'],['recusou','Recusou']],ev.accept||'bem')}</div>`;
 if(t==='diaper')h+=diaperSelect(isNew?S.cfg.diaperItem:ev.itemId);
 if(t==='med'){const names=[...new Set(allEv().filter(e=>e.type==='med').map(e=>e.name))];h+=`<div class="frow">${fld('Remédio',`<input name="name" id="f-name" list="medlist" value="${esc(ev.name||'')}" required placeholder="Ex.: Vitamina D">`)}${fld('Dose',`<input name="dose" id="f-dose" value="${esc(ev.dose||'')}" placeholder="Ex.: 2 gotas">`)}</div><datalist id="medlist">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`}
 if(t==='temp')h+=fld('Temperatura (°C)',`<input name="value" id="f-val" inputmode="decimal" value="${ev.value!=null?String(ev.value).replace('.',','):''}" required placeholder="Ex.: 36,8">`);
 if(t==='note')h+=fld('Anotação',`<textarea name="text" id="f-text" required>${esc(ev.text||'')}</textarea>`);
 if(t!=='note')h+=fld('Observação (opcional)',`<input name="note" id="f-note" value="${esc(ev.note||'')}">`);
 return h;
}
function evFromForm(fd,t){
 const o={type:t,start:fromLocalInput(fd.start)||Date.now(),note:(fd.note||'').trim()||undefined};
 if(t==='sleep')o.end=fromLocalInput(fd.end);
 if(t==='feed'){o.kind=fd.kind;if(fd.kind==='peito'){o.side=fd.side;o.end=fromLocalInput(fd.end)}else{o.end=o.start;o.side=undefined}
  if(fd.kind==='mamadeira'){o.ml=+fd.ml||0;o.milk=fd.milk}if(fd.kind==='solido'){o.food=(fd.food||'').trim();o.accept=fd.accept}}
 if(t==='diaper'){o.kind=fd.kind;o.itemId=fd.itemId||undefined}
 if(t==='med'){o.name=(fd.name||'').trim();o.dose=(fd.dose||'').trim();if(!o.name){toast('Informe o nome do remédio.',true);return null}}
 if(t==='temp'){o.value=parseFloat(String(fd.value).replace(',','.'));if(!(o.value>30&&o.value<45)){toast('Informe uma temperatura válida, como 36,8.',true);return null}}
 if(t==='note'){o.text=(fd.text||'').trim();if(!o.text){toast('Escreva a anotação.',true);return null}}
 if(o.end!=null&&o.end<o.start){toast('O fim precisa ser depois do início.',true);return null}
 return o;
}
const TITLES={sleep:'Sono',feed:'Mamada',diaper:'Troca de fralda',med:'Remédio',temp:'Temperatura',bath:'Banho',note:'Anotação'};
function wireShow(f){const upd=()=>{const k=f.querySelector('input[name=kind]:checked')?.value;f.querySelectorAll('[data-show]').forEach(el=>el.hidden=el.dataset.show!==k)};f.querySelectorAll('input[name=kind]').forEach(r=>r.addEventListener('change',upd));upd()}
function openEventForm(ev,isNew){
 openModal({title:isNew?'Registrar '+TITLES[ev.type].toLowerCase():TITLES[ev.type],body:eventForm(ev,isNew)+(ev.by&&!isNew?`<div class="hint">Registrado por ${esc(ev.by)}</div>`:''),mount:wireShow,
  onSave:async fd=>{const o=evFromForm(fd,ev.type);if(!o)return false;if(isNew)await addEvent(o);else await updateEvent(ev,o);toast('Salvo')},
  onDelete:isNew?null:async()=>{await deleteEvent(ev);toast('Registro apagado')}});
}

  ${fld('Data do resultado',`<input type="date" name="resultDate" id="x-resd" value="${e.resultDate||''}">`)}
  <div class="fld"><span>Como veio</span>${seg('outcome',[['normal','Normal'],['alterado','Alterado'],['aguardando','Falta o médico ver']],e.outcome||'normal')}</div>
  ${fld('O que diz o resultado',`<textarea name="result" id="x-res" placeholder="Valores principais, o que o médico falou…">${esc(e.result||'')}</textarea>`)}
 </div>
 <div class="fld"><span>Anexos (foto ou PDF do pedido e do resultado)</span><div class="files" id="x-files">${filesHtml()}</div>
  <input type="file" id="x-file" accept="image/png,image/jpeg,image/webp,image/heic,application/pdf" multiple></div>
 ${fld('Observações',`<textarea name="notes" id="x-notes" placeholder="Preparo, jejum, documentos para levar…">${esc(e.notes||'')}</textarea>`)}
 <input type="hidden" name="screen" value="${esc(e.screen||'')}">`}
function wireEx(f){const upd=()=>{const k=f.querySelector('input[name=status]:checked')?.value;f.querySelector('[data-res]').hidden=k!=='resultado'};f.querySelectorAll('input[name=status]').forEach(r=>r.addEventListener('change',upd));upd()}
function exFromForm(fd,old){if(UPLOADING){toast('Espere o anexo terminar de enviar.',true);return null}if(!fd.name.trim()){toast('Informe o nome do exame.',true);return null}
 const o={name:fd.name.trim(),cat:fd.cat,reqBy:fd.reqBy.trim(),status:fd.status,reqDate:fd.reqDate,date:fd.date,time:fd.time,place:fd.place.trim(),notes:fd.notes.trim(),files:XF,screen:fd.screen||'',gcal:!!old?.gcal&&old.date===fd.date&&old.time===fd.time};
 if(o.status==='agendado'&&!o.date){toast('Informe a data do exame agendado.',true);return null}
 if(o.status==='resultado'){o.outcome=fd.outcome;o.result=fd.result.trim();o.resultDate=fd.resultDate||isoDate(Date.now())}
 return o}
function openExam(e,isNew){openModal({title:isNew?'Novo exame':esc(e.name),body:exForm(e),mount:wireEx,
 onSave:async fd=>{const o=exFromForm(fd,e);if(!o)return false;await w(store.set('exams/'+(isNew?newId():e.id),o));toast('Exame salvo')},
 onDelete:isNew?null:async()=>{await w(store.del('exams/'+e.id));toast('Exame apagado')}})}
A.exAdd=()=>openExam({reqDate:isoDate(Date.now())},true);
A.exEdit=id=>{const e=S.exams.find(x=>x.id===id);if(e)openExam(e,false)};
A.exScreen=k=>{const e=S.exams.find(x=>x.screen===k);if(e)return openExam(e,false);const sc=SCREEN.find(x=>x[0]===k);openExam({name:sc[1],cat:'triagem',screen:k,status:'realizado',date:isoDate(Date.now())},true)};
A.xfDel=id=>{XF=XF.filter(f=>fpath(f)!==id);const el=$('#x-files');if(el)el.innerHTML=filesHtml()};
async function uploadFiles(input){const files=[...input.files];input.value='';
 for(const f of files){if(f.size>20*1024*1024){toast(f.name+' passa de 20 MB.',true);continue}
  UPLOADING++;const el=$('#x-files');if(el)el.insertAdjacentHTML('beforeend',`<span class="file" data-up>Enviando ${esc(f.name)}…</span>`);
  try{const safe=f.name.normalize('NFD').replace(/[^\w.-]+/g,'_').slice(-60);const path=`${FAM}/${Date.now().toString(36)}-${safe}`;const{error}=await sb.storage.from('files').upload(path,f,{contentType:f.type||undefined});if(error)throw{code:/mime|type/i.test(error.message)?'unsupported_type':/size|large/i.test(error.message)?'too_large':'x'};XF.push({path,name:f.name,type:f.type})}
  catch(e){toast(e?.code==='unsupported_type'?'Formato não aceito. Use foto (JPG ou PNG) ou PDF.':e?.code==='too_large'?'Arquivo grande demais (máx. 20 MB).':e?.code==='quota_or_state'?'O espaço para anexos acabou.':'Não deu para enviar '+f.name+'.',true)}
  finally{UPLOADING--;const e2=$('#x-files');if(e2)e2.innerHTML=filesHtml()}}}

A.fileOpen=async(p,el)=>{const win=window.open('about:blank','_blank');const{data,error}=await sb.storage.from('files').createSignedUrl(p,3600);if(error||!data){win&&win.close();toast('Não deu para abrir o arquivo.',true);return}if(win)win.location.href=data.signedUrl;else location.href=data.signedUrl};

/* conta e família */
A.loginMode=()=>{LOGIN_MODE=LOGIN_MODE==='criar'?'entrar':'criar';render()};
A.forgot=async()=>{const em=$('#l-email')?.value.trim();if(!em){toast('Digite seu e-mail primeiro.',true);return}const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});toast(error?'Não deu para enviar agora. Tente mais tarde.':'Enviamos um link para trocar a senha. Veja seu e-mail.',!!error)};
A.logout=async()=>{await sb.auth.signOut();location.hash='';location.reload()};
A.copyCode=async()=>{try{await navigator.clipboard.writeText(INVITE);toast('Código copiado')}catch(e){toast('Código: '+INVITE)}};

/* notificações */
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let PUSH='checking';
function b64u(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function checkPush(){
 if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){PUSH=isIOS&&!standalone?'ios-install':'unsupported';return render()}
 if(Notification.permission==='denied'){PUSH='denied';return render()}
 try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();PUSH=sub?'on':'off';
  if(sub&&FAM)await sb.from('push_subs').upsert({endpoint:sub.endpoint,family_id:FAM,user_id:ME.id,sub:sub.toJSON()})}catch(e){PUSH='off'}
 render();
}
function pushCard(){
 const what='<p class="small muted">Avisos de fralda acabando, consulta ou exame (na véspera e 2 h antes), vacina chegando ou atrasada e resultado de exame pendente.</p>';
 if(PUSH==='on')return what+'<p class="small"><span class="pill ok">Ativadas</span></p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="pushTest">Enviar um teste</button><button class="btn sm ghost" data-act="pushOff">Desativar</button></div>';
 if(PUSH==='off')return what+'<button class="btn primary" data-act="pushOn">Ativar notificações</button>';
 if(PUSH==='ios-install')return what+'<p class="small">No iPhone, primeiro instale o app: no Safari, toque em <b>Compartilhar</b> e em <b>Adicionar à Tela de Início</b>. Depois abra pelo ícone e volte aqui.</p>';
 if(PUSH==='denied')return what+'<p class="small">As notificações foram bloqueadas neste aparelho. Libere nas configurações do navegador ou do celular, para este app, e recarregue.</p>';
 if(PUSH==='unsupported')return what+'<p class="small">Este navegador não recebe notificações. Use o Chrome no Android ou o app instalado no iPhone.</p>';
 return what+'<p class="small muted">Verificando…</p>';
}
A.pushOn=()=>{Notification.requestPermission().then(async perm=>{
 if(perm!=='granted'){toast('Sem permissão, não dá para avisar. Você pode liberar depois.',true);return checkPush()}
 try{const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
  const{error}=await sb.from('push_subs').upsert({endpoint:sub.endpoint,family_id:FAM,user_id:ME.id,sub:sub.toJSON()});if(error)throw error;toast('Notificações ativadas')}
 catch(e){console.warn(e);toast('Não deu para ativar agora. Tente de novo.',true)}
 checkPush()})};
A.pushOff=async()=>{try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){await sb.from('push_subs').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}toast('Notificações desativadas')}catch(e){}checkPush()};
A.pushTest=async()=>{const{data,error}=await sb.functions.invoke('notify',{body:{test:true}});toast(error?'Não deu para enviar o teste.':(data&&data.sent)?'Teste enviado. Deve chegar em segundos.':'Nenhum aparelho ativo encontrado.',!!error||!(data&&data.sent))};

/* marcos */
function msForm(m){return`${fld('Conquista',`<input name="title" id="m-title" list="mslist" value="${esc(m.title||'')}" required placeholder="Ex.: Primeiro sorriso">`)}<datalist id="mslist">${MS_SUGG.map(s=>`<option value="${s}">`).join('')}</datalist>
 ${fld('Data',`<input type="date" name="date" id="m-date" value="${m.date||isoDate(Date.now())}" required>`)}${fld('Como foi',`<textarea name="note" id="m-note">${esc(m.note||'')}</textarea>`)}`}
const msFromForm=fd=>{if(!fd.title.trim()){toast('Dê um nome à conquista.',true);return null}return{title:fd.title.trim(),date:fd.date,note:fd.note.trim()}};
A.msAdd=()=>openModal({title:'Primeira vez',body:msForm({}),onSave:async fd=>{const o=msFromForm(fd);if(!o)return false;await w(store.set('milestones/'+newId(),o));toast('Conquista guardada')}});
A.msEdit=id=>{const m=S.ms.find(x=>x.id===id);if(!m)return;openModal({title:'Editar conquista',body:msForm(m),onSave:async fd=>{const o=msFromForm(fd);if(!o)return false;await w(store.set('milestones/'+id,o));toast('Salvo')},onDelete:async()=>{await w(store.del('milestones/'+id));toast('Apagado')}})};

A.mclose=closeModal;
A.mdel=async(id,btn)=>{if(!btn.classList.contains('armed')){btn.classList.add('armed');btn.textContent='Toque de novo para apagar';return}const fn=M?.onDelete;closeModal();if(fn)await fn()};

/* ============ eventos do DOM ============ */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
 const act=el.dataset.act;if(!A[act])return;
 if(el.tagName==='BUTTON')e.preventDefault();
 Promise.resolve(A[act](el.dataset.id,el)).catch(err=>console.warn(err));
});
document.addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target;
 if(f.id==='mf'&&M?.onSave){const btn=f.querySelector('button[type=submit]');btn&&(btn.disabled=true);try{const r=await M.onSave(fdata(f),f);if(r!==false)closeModal()}catch(err){}finally{btn&&(btn.disabled=false)}return}
 if(f.id==='loginForm'){const fd=fdata(f),email=fd.email.trim(),btn=f.querySelector('button[type=submit]');
  if(LOGIN_MODE==='criar'&&fd.password!==fd.password2){toast('As senhas não são iguais.',true);return}
  if((fd.password||'').length<6){toast('A senha precisa ter pelo menos 6 caracteres.',true);return}
  btn.disabled=true;const{error}=LOGIN_MODE==='criar'?await sb.auth.signUp({email,password:fd.password}):await sb.auth.signInWithPassword({email,password:fd.password});btn.disabled=false;
  if(error)toast(/registered|already/i.test(error.message)?'Esse e-mail já tem conta. Toque em "Já tenho conta".':/invalid/i.test(error.message)?'E-mail ou senha incorretos.':'Não deu para entrar: '+error.message,true);return}
 if(f.id==='famCreate'||f.id==='famJoin'){const fd=fdata(f);const btn=f.querySelector('button[type=submit]');btn.disabled=true;
  const r=f.id==='famCreate'?await sb.rpc('create_family',{p_name:'Família',p_display:fd.display.trim()}):await sb.rpc('join_family',{p_code:fd.code.trim(),p_display:fd.display.trim()});btn.disabled=false;
  if(r.error){toast(/codigo/i.test(r.error.message)?'Código não encontrado. Confira as letras e números.':'Não deu agora. Tente de novo.',true);return}
  await loadFamily();return}
 if(f.id==='nameForm'){const d=fdata(f).display.trim();if(!d)return;const{error}=await sb.from('members').update({display_name:d}).eq('family_id',FAM).eq('user_id',ME.id);if(error){toast('Não deu para salvar.',true);return}WHO=d;await loadMembers();toast('Nome salvo');return}
 if(f.id==='pwForm'&&M){return}
 if(f.id==='setupForm'){const fd=fdata(f);if(!fd.name.trim()||!fd.birth){toast('Informe o nome e a data de nascimento.',true);return}
  const cfg={name:fd.name.trim(),birth:fd.birth,sex:fd.sex,diaperItem:''};
  try{if(+fd.qty>0){const id=newId();await w(store.set('inventory/'+id,{name:'Fralda',cat:'fralda',size:fd.size,qty:+fd.qty,min:30,unit:'un.',note:''}));cfg.diaperItem=id}
   await w(store.set('config/main',cfg));toast('Tudo pronto!')}catch(err){}return}
 if(f.id==='cfgForm'){const fd=fdata(f);if(!fd.name.trim()||!fd.birth){toast('Nome e nascimento são obrigatórios.',true);return}
  const o={...S.cfg};['name','birth','sex','blood','allergies','pedName','pedPhone','plan','card','diaperItem'].forEach(k=>o[k]=(fd[k]||'').trim());
  try{await w(store.set('config/main',o));toast('Dados salvos')}catch(err){}}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.name==='quem'||t.name==='quem2'){WHO=t.value;lsSet('bebe-quem',WHO);toast('Registrando como '+WHO);render()}
 if(t.id==='x-file')uploadFiles(t);
 if(t.id==='dayPick'&&t.value)setDay(new Date(t.value+'T12:00').getTime());
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&M)closeModal()});
let toastT;function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast'+(err?' err':'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,err?4500:2200)}

/* ============ início ============ */
function subscribeAll(){
 store.doc('config/main',d=>{S.cfg=d;render()});
 store.col('inventory',l=>{S.inv=l;render()});
 store.col('growth',l=>{S.growth=l;render()});
 store.col('agenda',l=>{S.agenda=l;render()});
 store.col('vaccines',l=>{S.vax=Object.fromEntries(l.map(x=>[x.id,x]));render()});
 store.col('milestones',l=>{S.ms=l;render()});
 store.col('exams',l=>{S.exams=l;render()});
 subMonths();
}
let curYm=ymOf(Date.now());
setInterval(()=>{const ym=ymOf(Date.now());if(ym!==curYm){curYm=ym;if(FAM)subMonths()}if(!M&&S.cfg&&S.tab!=='ajustes')render()},30000);
async function loadMembers(){const{data}=await sb.from('members').select('user_id,display_name').eq('family_id',FAM);MEMBERS=data||[];render()}
async function loadFamily(){
 const{data,error}=await sb.from('members').select('family_id,display_name,families(invite_code)').eq('user_id',ME.id).limit(1);
 if(error){S.stale=true;AUTH='ready';return render()}
 if(!data||!data.length){FAM=null;AUTH='ready';return render()}
 FAM=data[0].family_id;WHO=data[0].display_name||'';INVITE=data[0].families?.invite_code||'';AUTH='ready';
 subscribeAll();loadMembers();checkPush();
 sb.channel('fam-'+FAM).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'family_id=eq.'+FAM},p=>{const r=p.new;if(!r||!r.path)return;r.deleted?cache.delete(r.path):cache.set(r.path,r.data);touch(r.path)}).subscribe(st=>{if(st==='SUBSCRIBED')refetchAll()});
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&FAM)refetchAll()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==S.tab){S.tab=h;render()}});
{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))S.tab=h}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e));
sb.auth.onAuthStateChange((ev,session)=>{
 if(ev==='PASSWORD_RECOVERY'){setTimeout(()=>openModal({title:'Nova senha',saveLabel:'Salvar senha',body:fld('Nova senha','<input type="password" name="pw" id="p-new" minlength="6" required autocomplete="new-password">'),onSave:async fd=>{if((fd.pw||'').length<6){toast('Mínimo de 6 caracteres.',true);return false}const{error}=await sb.auth.updateUser({password:fd.pw});if(error){toast('Não deu para trocar a senha.',true);return false}toast('Senha trocada')}}),300)}
 const u=session?.user||null;
 if(u&&(!ME||ME.id!==u.id)){ME=u;loadFamily()}
 else if(!u){ME=null;FAM=null;AUTH='ready';render()}
});
render();
</script>
